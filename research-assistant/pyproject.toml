[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research-assistant"
version = "0.1.0"
description = "Local research paper knowledge base with MCP, CLI, and web UI"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24.0",
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "typer[all]>=0.12.0",
    "mcp[cli]>=1.0.0,<2",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "ollama>=0.2.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2.1",
    "rank-bm25>=0.2.2",
    "PyYAML>=6.0.1",
]

[project.scripts]
ra = "cli.main:app"
ra-mcp = "mcp_server.server:run"
ra-api = "api.app:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "cli*", "mcp_server*", "api*"]
