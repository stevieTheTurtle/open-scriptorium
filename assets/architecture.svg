  <text x="46" y="188" fill="#5A5247" font-family="'Segoe UI', 'Noto Sans', sans-serif" font-size="12">• PDF citation tooltips &amp; flags</text>
  <text x="46" y="212" fill="#5A5247" font-family="'Segoe UI', 'Noto Sans', sans-serif" font-size="12">• Claim-support finder (Ctrl+Alt+C)</text>
