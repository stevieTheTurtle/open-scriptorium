  <circle cx="350" cy="99.3" r="1.2" fill="#9A6B1E"/>
  <text x="367" y="100" fill="#9A6B1E" font-family="'Segoe UI', 'Noto Sans', sans-serif" font-size="14" font-weight="700">Second-hand</text>
  <text x="342" y="126" fill="#4A443A" font-family="'Segoe UI', 'Noto Sans', sans-serif" font-size="12">Cited by other papers in your library</text>

  <!-- Unverified -->
  <rect x="616" y="70" width="276" height="78" rx="6" fill="#FFFFFF" stroke="#8B2635" stroke-width="1.3"/>
