  <text x="73" y="100" fill="#2E5A44" font-family="'Segoe UI', 'Noto Sans', sans-serif" font-size="14" font-weight="700">Verified</text>
  <text x="48" y="126" fill="#4A443A" font-family="'Segoe UI', 'Noto Sans', sans-serif" font-size="12">In Zotero · hover for verbatim quote</text>

  <!-- Second-hand -->
  <rect x="322" y="70" width="276" height="78" rx="6" fill="#FFFFFF" stroke="#9A6B1E" stroke-width="1.3"/>
  <rect x="322" y="70" width="6" height="78" rx="3" fill="#9A6B1E"/>
