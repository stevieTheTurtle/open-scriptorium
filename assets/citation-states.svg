  <text x="28" y="42" fill="#1C1917" font-family="'Segoe UI', 'Noto Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="700" letter-spacing="-0.015em">Citation Verification States</text>
  <line x1="28" y1="54" x2="892" y2="54" stroke="#D5C9B2" stroke-width="1"/>

  <!-- Verified -->
  <rect x="28" y="70" width="276" height="78" rx="6" fill="#FFFFFF" stroke="#2E5A44" stroke-width="1.3"/>
