<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="cover" x1="10" y1="8" x2="118" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7A2230"/>
      <stop offset="100%" stop-color="#4F141E"/>
    </linearGradient>
    <linearGradient id="leftLeaf" x1="24" y1="30" x2="64" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCF9F2"/>
      <stop offset="100%" stop-color="#EDE4D0"/>
    </linearGradient>
    <linearGradient id="rightLeaf" x1="64" y1="30" x2="104" y2="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FAF6EC"/>
      <stop offset="100%" stop-color="#E6DAC2"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F0D796"/>
      <stop offset="55%" stop-color="#D7AF5A"/>
      <stop offset="100%" stop-color="#A87A2B"/>
    </linearGradient>
    <linearGradient id="ribbonGold" x1="60.5" y1="98" x2="67.5" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B0812C"/>
      <stop offset="35%" stop-color="#F1D997"/>
      <stop offset="68%" stop-color="#D1A64D"/>
      <stop offset="100%" stop-color="#966A20"/>
    </linearGradient>
    <radialGradient id="waxSeal" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#3E7558"/>
      <stop offset="58%" stop-color="#28503C"/>
      <stop offset="100%" stop-color="#193426"/>
    </radialGradient>
    <linearGradient id="penBarrel" x1="-6" y1="-35" x2="6" y2="-35" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3E342D"/>
      <stop offset="45%" stop-color="#221C18"/>
      <stop offset="100%" stop-color="#14100E"/>
    </linearGradient>
  </defs>

  <!-- Clothbound Oxford burgundy tile with gilded double frame -->
  <rect x="4" y="4" width="120" height="120" rx="22" fill="url(#cover)" stroke="#3B0E16" stroke-width="2"/>
  <rect x="11" y="11" width="106" height="106" rx="16" stroke="url(#gold)" stroke-width="1.6" stroke-opacity="0.85"/>

  <!-- Open archival codex / manuscript book -->
  <!-- Dark spine & cover edge underneath -->
  <path d="M22 41 C38 35, 54 37, 64 43 C74 37, 90 35, 106 41 L106 95 C90 89, 74 91, 64 97 C54 91, 38 89, 22 95 Z" fill="#2B1418" fill-opacity="0.45" transform="translate(0, 4)"/>

  <!-- Woven gold silk bookmark ribbon emerging naturally from behind the open folios -->
  <g>
    <path d="M61.4 89 C61.3 96.5, 61.0 104, 60.6 111.5 L64.0 106.8 L67.4 111.5 C67.0 104, 66.7 96.5, 66.6 89 Z" fill="#1A0A0D" fill-opacity="0.36" transform="translate(0.9, 1.3)"/>
    <path d="M61.3 88 C61.2 95.5, 60.9 103.5, 60.5 111.5 L64.0 106.8 L67.5 111.5 C67.1 103.5, 66.8 95.5, 66.7 88 Z" fill="url(#ribbonGold)" stroke="#855D1A" stroke-width="0.65" stroke-linejoin="round"/>
    <path d="M63.0 92 C62.9 97.5, 62.8 102.5, 62.7 107.2" stroke="#FFF6D6" stroke-width="0.85" stroke-opacity="0.45" stroke-linecap="round"/>
    <path d="M61.1 91.5 L66.9 91.5 L66.8 96.4 C65.2 95.4, 62.8 95.4, 61.2 96.4 Z" fill="#2B1418" fill-opacity="0.35"/>
  </g>

  <!-- Left folio -->
  <path d="M24 38 C39 32, 54 34, 64 40 L64 93 C54 87, 39 85, 24 91 Z" fill="url(#leftLeaf)" stroke="#C7B89A" stroke-width="1.2"/>
  <!-- Right folio -->
  <path d="M104 38 C89 32, 74 34, 64 40 L64 93 C74 87, 89 85, 104 91 Z" fill="url(#rightLeaf)" stroke="#C7B89A" stroke-width="1.2"/>
  <!-- Center gutter shadow -->
  <line x1="64" y1="40" x2="64" y2="93" stroke="#B6A586" stroke-width="1.4"/>

  <!-- Illuminated rubricated box with classical Roman serif drop-cap "A" -->
  <rect x="30" y="45.5" width="13" height="14" rx="1.6" fill="#8B2635"/>
  <rect x="31.3" y="46.8" width="10.4" height="11.4" rx="0.9" stroke="#E7C983" stroke-width="0.65" stroke-opacity="0.72"/>
  <path transform="translate(31.7, 48.0) scale(0.96, 0.94)" fill="#FAF6EE" fill-rule="evenodd"
        d="M4.9 0.35 L5.35 0.35 L8.65 8.55 Q8.95 9.15 9.65 9.2 L9.65 9.75 L6.0 9.75 L6.0 9.2 Q6.85 9.15 6.95 8.5 L6.2 6.6 L3.4 6.6 L2.7 8.5 Q2.6 9.15 3.45 9.2 L3.45 9.75 L0.5 9.75 L0.5 9.2 Q1.25 9.15 1.65 8.5 L4.9 0.35 Z M4.82 2.25 L3.68 5.85 L5.92 5.85 Z"/>

  <!-- Ruled manuscript lines on left page -->
  <line x1="46" y1="49" x2="57.5" y2="50.2" stroke="#6F6556" stroke-width="1.9" stroke-linecap="round"/>
  <line x1="46" y1="55.5" x2="57.5" y2="56.7" stroke="#8C806E" stroke-width="1.9" stroke-linecap="round"/>
  <line x1="30.5" y1="65" x2="57.5" y2="67" stroke="#8C806E" stroke-width="1.9" stroke-linecap="round"/>
  <line x1="30.5" y1="71.5" x2="57.5" y2="73.5" stroke="#8C806E" stroke-width="1.9" stroke-linecap="round"/>
  <line x1="30.5" y1="78" x2="50.5" y2="79.5" stroke="#A69A87" stroke-width="1.9" stroke-linecap="round"/>

  <!-- Ruled lines on right page -->
  <line x1="70.5" y1="50.2" x2="97" y2="48.2" stroke="#8C806E" stroke-width="1.9" stroke-linecap="round"/>
  <line x1="70.5" y1="57" x2="97" y2="55" stroke="#8C806E" stroke-width="1.9" stroke-linecap="round"/>
  <line x1="70.5" y1="64" x2="87" y2="62.8" stroke="#A69A87" stroke-width="1.9" stroke-linecap="round"/>

  <!-- Amanuense scalloped archival wax seal with embossed medieval fleuron -->
  <g>
    <!-- Soft parchment shadow beneath wax seal -->
    <path transform="translate(0.7, 1.0)" fill="#1E1A16" fill-opacity="0.22"
          d="M95.6 76.0 Q96.75 78.84 94.15 80.47 Q93.41 83.44 90.35 83.23 Q88.00 85.20 85.65 83.23 Q82.59 83.44 81.85 80.47 Q79.25 78.84 80.40 76.00 Q79.25 73.16 81.85 71.53 Q82.59 68.56 85.65 68.77 Q88.00 66.80 90.35 68.77 Q93.41 68.56 94.15 71.53 Q96.75 73.16 95.60 76.00 Z"/>
    <!-- Hand-poured scalloped emerald wax body -->
    <path fill="url(#waxSeal)" stroke="#173023" stroke-width="0.65"
          d="M95.6 76.0 Q96.75 78.84 94.15 80.47 Q93.41 83.44 90.35 83.23 Q88.00 85.20 85.65 83.23 Q82.59 83.44 81.85 80.47 Q79.25 78.84 80.40 76.00 Q79.25 73.16 81.85 71.53 Q82.59 68.56 85.65 68.77 Q88.00 66.80 90.35 68.77 Q93.41 68.56 94.15 71.53 Q96.75 73.16 95.60 76.00 Z"/>
    <!-- Recessed die-stamped circular impression with gilded rim -->
    <circle cx="88" cy="76" r="5.55" fill="#1F4030" stroke="#E7C983" stroke-width="0.7" stroke-opacity="0.75"/>
    <circle cx="88" cy="76" r="4.5" stroke="#E7C983" stroke-width="0.45" stroke-dasharray="1.1 1.25" stroke-opacity="0.55"/>
    <!-- Classical medieval 4-point fleuron / compass-star emblem -->
    <path d="M88 72.1 Q88.65 75.35 91.9 76 Q88.65 76.65 88 79.9 Q87.35 76.65 84.1 76 Q87.35 75.35 88 72.1 Z" fill="#F0D796"/>
    <circle cx="88" cy="76" r="0.85" fill="#234735"/>
    <circle cx="85.8" cy="73.8" r="0.5" fill="#E7C983" fill-opacity="0.85"/>
    <circle cx="90.2" cy="73.8" r="0.5" fill="#E7C983" fill-opacity="0.85"/>
    <circle cx="85.8" cy="78.2" r="0.5" fill="#E7C983" fill-opacity="0.85"/>
    <circle cx="90.2" cy="78.2" r="0.5" fill="#E7C983" fill-opacity="0.85"/>
  </g>

  <!-- Classical fountain pen angled down-left onto the manuscript page -->
  <g transform="translate(76, 56) rotate(40)">
    <!-- Soft shadow cast onto folio -->
    <g transform="translate(1.8, 2.2)" opacity="0.24">
      <path d="M0 0 C2.4 -4.5, 5.8 -8.2, 6.8 -11.5 C6.2 -14.2, 5.2 -16.8, 4.6 -19 L5.4 -22.5 L6.0 -35 C6.0 -42, 3.5 -46.5, 0 -47.5 C-3.5 -46.5, -6.0 -42, -6.0 -35 L-5.4 -22.5 L-4.6 -19 C-5.2 -16.8, -6.2 -14.2, -6.8 -11.5 C-5.8 -8.2, -2.4 -4.5, 0 0 Z" fill="#1A0B0E"/>
    </g>
    <!-- Ebony lacquered barrel -->
    <path d="M-5.2 -22 L-6.0 -35 C-6.0 -42, -3.5 -46.5, 0 -47.5 C3.5 -46.5, 6.0 -42, 6.0 -35 L5.2 -22 Z" fill="url(#penBarrel)" stroke="#E7C983" stroke-width="1.05" stroke-opacity="0.8"/>
    <!-- Subtle specular highlight on barrel -->
    <line x1="-2.4" y1="-25" x2="-2.8" y2="-41" stroke="#FFF4D6" stroke-width="1.3" stroke-linecap="round" stroke-opacity="0.25"/>
    <!-- Gold cap band -->
    <rect x="-5.8" y="-35.8" width="11.6" height="2.4" rx="0.8" fill="url(#gold)"/>
    <!-- Gold ferrule / collar -->
    <rect x="-5.4" y="-22.6" width="10.8" height="4.2" rx="1.1" fill="url(#gold)" stroke="#382010" stroke-width="1.05"/>
    <!-- Flared gold fountain-pen nib pointing down-left -->
    <path d="M0 0 C2.4 -4.5, 5.8 -8.2, 6.8 -11.5 C6.2 -14.2, 5.2 -16.8, 4.6 -19 L-4.6 -19 C-5.2 -16.8, -6.2 -14.2, -6.8 -11.5 C-5.8 -8.2, -2.4 -4.5, 0 0 Z" fill="url(#gold)" stroke="#382010" stroke-width="1.25" stroke-linejoin="round"/>
    <!-- Center slit and breather hole -->
    <line x1="0" y1="-1.2" x2="0" y2="-10.5" stroke="#2B1418" stroke-width="1.35" stroke-linecap="round"/>
    <circle cx="0" cy="-10.8" r="1.8" fill="#2B1418"/>
  </g>
</svg>
